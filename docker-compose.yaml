services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: airline-voucher-backend

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_NAME: /app/data/vouchers.db

    volumes:
      - sqlite_data:/app/data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: airline-voucher-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://backend:3000/api

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  sqlite_data: